server:
  port: "${SERVER_PORT}"
spring:
  application:
    name: "BusinessManagerCore"
  devtools:
    add-properties: false
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
security:
  webhook-token: "${WEBHOOK_TOKEN}"
adapters:
  r2dbc:
    host: "${CORE_DB_HOST}"
    port: "${CORE_DB_PORT}"
    database: "${CORE_DB_NAME}"
    schema: "${CORE_DB_SCHEMA}"
    username: "${CORE_DB_USERNAME}"
    password: "${CORE_DB_PASSWORD}"
    pool:
      initial-size: "${CORE_DB_POOL_INITIAL_SIZE}"
      max-size: "${CORE_DB_POOL_MAX_SIZE}"
      max-idle-time: "${CORE_DB_POOL_MAX_IDLE_TIME}"
logging:
  level:
    io:
      r2dbc:
        postgresql: "${LOGGING_LEVEL}"
    org:
      springframework:
        data:
          r2dbc: "${LOGGING_LEVEL}"
